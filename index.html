<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reset Password — Bingwa Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #f3f4f6;
      padding: 16px;
    }
    .card {
      background: #131b2e;
      border: 1px solid #232f48;
      padding: 32px 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: rgba(255, 102, 0, 0.15);
      border: 1px solid rgba(255, 102, 0, 0.35);
      border-radius: 12px;
      margin-bottom: 12px;
      color: #ff6600;
      font-size: 22px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #ff6600;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff6600;
      color: #ffffff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #ea580c;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      display: none;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.4;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .message.success {
      background: rgba(255, 102, 0, 0.12);
      color: #ff6600;
      border: 1px solid rgba(255, 102, 0, 0.25);
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="badge">✦</div>
      <div class="title">Bingwa Agent Portal</div>
      <div id="targetAccount" class="subtitle">Set your new secure password</div>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Minimum 6 characters" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your new password" minlength="6" required />
      </div>
      <button type="submit" id="submitBtn">Update Password</button>
    </form>

    <div id="statusMsg" class="message"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA4K5352NDTy7c6Fn446icUHyPZl89DORg",
      authDomain: "bingwa-clone.firebaseapp.com",
      projectId: "bingwa-clone",
      storageBucket: "bingwa-clone.firebasestorage.app",
      messagingSenderId: "669949462056",
      appId: "1:669949462056:web:5d62d40389d2bcee38971d",
      measurementId: "G-YBQZNXPFD5"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');
    const form = document.getElementById('resetForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (!oobCode) {
      form.style.display = 'none';
      statusMsg.className = 'message error';
      statusMsg.style.display = 'block';
      statusMsg.textContent = 'Invalid or missing authentication token in the link.';
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1 !== p2) {
        statusMsg.className = 'message error';
        statusMsg.style.display = 'block';
        statusMsg.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      statusMsg.style.display = 'none';

      auth.confirmPasswordReset(oobCode, p1)
        .then(() => {
          statusMsg.className = 'message success';
          statusMsg.style.display = 'block';
          statusMsg.textContent = 'Password reset successfully! You can now log in to the Bingwa Agent app.';
          form.style.display = 'none';
        })
        .catch((err) => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          statusMsg.className = 'message error';
          statusMsg.style.display = 'block';
          if (err.code === 'auth/invalid-action-code') {
            statusMsg.textContent = 'This reset link has expired or has already been used. Please request a new link.';
          } else {
            statusMsg.textContent = err.message || 'Failed to update password.';
          }
        });
    });
  </script>
</body>
          </html>
